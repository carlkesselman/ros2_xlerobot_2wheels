object_perception:
  ros__parameters:
    image_topic: /cameras/head/image_raw
    depth_topic: /cameras/head/depth/image_raw
    camera_info_topic: /cameras/head/camera_info
    target_frame: base_footprint
    frames: 3                 # frames merged per call
    min_score: 0.15           # OWLv2 score threshold
    max_objects: 6
    table_search_m: 0.12      # ring around an object used to read the table height from the depth
    engines_dir: ""           # empty = ~/.cache/xlerobot/engines
    prompts_file: ""          # empty = ~/.cache/xlerobot/prompts.npz
    sam_variant: l0
    # Multiplies the head depth camera's readings. Measure it for your camera with tools/depth_scale.py
    # (docs/setup.md#9-head-depth-scale); this value is the reference robot's, whose camera read 0.8% too far.
    depth_scale: 0.992
    # Wrist cameras (/perception/locate_in_wrist): the claw's mask per camera is config/wrist_occluder_<arm>.png, made
    # with tools/wrist_occluder.py; these are the reference robot's printed claws, make your own.
    wrist_occluder_dir: ""    # empty = this package's config directory
    wrist_min_score: 0.05     # OWLv2 threshold in the wrist view (the object is close and large)
    wrist_max_rms_px: 4.0     # a fit whose outline misses the mask's by more than this is refused (NO_FIT)
