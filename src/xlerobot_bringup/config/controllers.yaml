# controller_manager config for the base, arms and head.
#
# update_rate: 100Hz. The servo bus's own wire budget allows more (see
# ARCHITECTURE §4.3), but controller_manager's real-time loop runs on the
# host, not the bus, and 200Hz (5ms budget) overruns on a non-RT desktop
# kernel under load, particularly with Isaac Sim's own GPU/CPU usage
# competing for the same cores. 100Hz gives that loop headroom regardless
# of which hardware interface is loaded (real bus, mock, or the Isaac Sim
# topic bridge). Raise it only with an RT kernel or isolated cores backing
# the measurement.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Without this, command limits declared on the URDF command_interface
    # (wheel velocity min/max) are parsed but not enforced, tested this
    # against a real controller_manager and it logs it plainly otherwise.
    # Extra safety net on top of whatever the servo bus itself clamps.
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # Arms, spawned only when the arm joints have command interfaces (with_arms:=true
    # torque_off:=false, or the sim), see bringup.launch.py.
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Head, spawned only when with_head:=true torque_off:=false (or the sim), see
    # bringup.launch.py.
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # TODO pull these from robot_dimensions.yaml instead of duplicating them
    # here. For now keep in sync by hand. Cart-measured values, see
    # robot_dimensions.yaml (6.5 in hub wheels, 527 mm track).
    wheel_separation: 0.527
    wheel_radius: 0.0828

    # Calibrate with tools/calibrate_wheel_odometry.py, see ARCHITECTURE §6.
    # 1.0 until measured on this cart (the servo base's 0.9412 doesn't carry over).
    wheel_separation_multiplier: 1.0

    # The LEFT motor is the mirrored one on this cart: ../XLeRobot's
    # cart-remote.yaml has invert_left_wheel: true, settled on the real board
    # with config/odrive-check.sh --spin. The ODrive joints report the raw axis
    # (xlerobot.ros2_control.xacro), so the correction lives here: a negative
    # radius flips both the outgoing command and the odometry reading for this
    # wheel. Don't also invert in the hardware interface, it would
    # double-correct. If forward drives the cart in a circle, this is wrong.
    left_wheel_radius_multiplier: -1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal:  [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    # open_loop:false means this reads wheel POSITION from the hardware
    # interface and differences it. The ODrive reports the encoder's
    # multi-turn position directly, so the servo base's wrap problem
    # (ARCHITECTURE §4.1) doesn't arise here.
    open_loop: false
    enable_odom_tf: true

    # robot_dimensions.yaml limits: 1.0 m/s and 1.0 m/s^2 were validated on
    # this cart (rug and hardwood, 2026-10-25). The ODESC's own VEL_RAMP limits
    # each wheel's acceleration as well.
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 2.0
    angular.z.min_acceleration: -2.0

    # tighter than upstream's 500ms host watchdog, see ARCHITECTURE §4.4, and
    # inside the ODESC's own 0.5 s watchdog, so the controller zeroes the wheels
    # before the board has to
    cmd_vel_timeout: 0.25
    use_stamped_vel: true

# ---- arm controllers ----
# No per-joint trajectory/goal tolerance here on purpose. ros2_control's JointTrajectoryController
# defaults both to -1 (check disabled) when not set. Had them at 0.25/0.06 originally; MoveIt-issued
# goals (unlike the single-point moves tools/single_joint_test.py sends) consistently aborted on the
# real robot with "state tolerance violation" partway through, at both 0.8 and 0.2 MoveIt velocity
# scaling, and mock hardware (zero physical lag) tracked the identical trajectory to within
# 0.004-0.005 rad and passed cleanly - so the gap is real servo response lag against an intermediate
# tracking check, not planned speed or a mock-detectable bug. Tried loosening trajectory/goal
# instead of removing them (0.5/0.06, goal_time 3.0): still aborted, just later, on MoveIt's own
# separate execution-duration watchdog instead. Removed entirely after checking a reference project
# on the same STS3215/SO-101 hardware (github.com/legalaspro/so101-ros-physical-ai) that runs
# without any trajectory/goal tolerance at all, only stopped_velocity_tolerance. This is a diagnostic
# baseline to confirm the tolerance check itself was the blocker - re-tighten with real numbers once
# that is confirmed, do not leave a live arm permanently without any tracking check.

left_arm_controller:
  ros__parameters:
    joints: [left_arm_shoulder_pan_joint, left_arm_shoulder_lift_joint, left_arm_elbow_flex_joint, left_arm_wrist_flex_joint, left_arm_wrist_roll_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    # A goal that names only some of the joints would leave the others to hold whatever
    # the last trajectory ended on, better refused.
    allow_partial_joints_goal: false
    # Closed loop: the trajectory starts from the measured state. On activation the controller
    # holds the position the joints are at, the driver seeds the command with it.
    open_loop_control: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.05

right_arm_controller:
  ros__parameters:
    joints: [right_arm_shoulder_pan_joint, right_arm_shoulder_lift_joint, right_arm_elbow_flex_joint, right_arm_wrist_flex_joint, right_arm_wrist_roll_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    # A goal that names only some of the joints would leave the others to hold whatever
    # the last trajectory ended on, better refused.
    allow_partial_joints_goal: false
    # Closed loop: the trajectory starts from the measured state. On activation the controller
    # holds the position the joints are at, the driver seeds the command with it.
    open_loop_control: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
