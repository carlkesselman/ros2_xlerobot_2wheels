# Cameras started by cameras.launch.py (bringup cameras:=true). A camera whose
# device is not connected is skipped, so this can list all of them.
# Devices are the udev symlinks from tools/xlerobot_setup_usb_modules.py.
#
# Each camera publishes <name>/image_raw plus its transports, the video one is
# <name>/image_raw/ffmpeg (H.264 packets, what Rerun and the bag record).
#
# The cameras send MJPG, raw YUYV from three of them would not fit on USB 2.0.
# The Jetson's ffmpeg has no hardware encoder that works here (its NVENC is the
# desktop API), so encoding is libx264 in software, about 17% of one core per
# camera at 640x480 30 fps. libx264 needs the preset/tune options to open.
defaults:
  width: 640
  height: 480
  fps: 30.0
  pixel_format: mjpeg2rgb
  encoder: libx264
  encoder_options: "preset:ultrafast,tune:zerolatency"
  bit_rate: 2000000
  gop_size: 30
  # usb_cam's own default is 50, near the top of these cameras' -64..64 range: washed out in sunlight
  brightness: 0
  # The remote viewer's copy: <name>/viewer/compressed, every viewer_fps-th of a second's newest
  # JPEG (topic_tools throttle on image_raw/compressed), what tools/rerun_bridge.py shows by
  # default. Rerun's decoder lags a live H.264 stream: the frames showed faded with a loading
  # spinner and flashed (2026-11-14). Standalone JPEGs at 10 fps are what the lerobot setup
  # settled on for the Mac viewer over wifi. 0 = no viewer copy. jpeg_quality is
  # compressed_image_transport's, default 95, about 120 KB a frame here.
  viewer_fps: 10
  jpeg_quality: 70

# frame_id is the camera's optical frame in the URDF (head from sensors.xacro, the
# wrist ones from so101_arm.xacro), so the video can be placed in the robot. It's also the
# usb_cam node's own frame_id param when sensor:=usbcam.
#
# head's value here only matches the usbcam branch (the common case, and this stack's own
# default - see ADR-0003). A depth camera like the Gemini 2 (sensor:=gemini) names its own
# optical frame differently (e.g. head_color_optical_frame - the driver's choice, not fixed
# across sensor types), so this static value would be wrong for it. That's fine: the MCP
# server (tools/mcp_server/bridge.py) reads the real frame_id live off each camera's own
# camera_info instead of this file, for exactly this reason - this value is only its
# last-resort fallback before the first camera_info message arrives.
#
# device may be a list: the first path that exists is used. elroy has no xle-cam-* rules yet. Its
# wrist cameras are /dev/cam_left and /dev/cam_right, from its own 99-cameras.rules, bound to hub
# ports 2.2.2 and 2.2.4. Its head camera is a RealSense D415, read here as a plain UVC camera: its
# colour stream (YUYV) is interface 1.3 of the device on root port 2, the only thing on that
# port. That works until sensor:=realsense exists (docs/rosie-port-plan.md 2.3); it gives
# colour only, no depth.
cameras:
  head:
    device:
      - /dev/xle-cam-head
      - path: /dev/v4l/by-path/platform-3610000.usb-usb-0:2:1.3-video-index0   # elroy: D415 colour
        pixel_format: yuyv2rgb
    frame_id: head_camera_optical_frame
    # sensor:=realsense: the D415 through realsense2_camera instead of usb_cam (colour and
    # aligned depth, cameras.launch.py _realsense_head). Profiles are "width,height,fps".
    # depth_viewer_*: the light copy of the depth for the remote viewer.
    realsense:
      serial_no: "836112060112"
      color_profile: "640,480,30"
      depth_profile: "640,480,30"
      depth_viewer_scale: 0.5
      depth_viewer_fps: 5
  left:
    device: [/dev/xle-cam-left, /dev/cam_left]
    frame_id: left_arm_wrist_camera_optical_frame
  right:
    device: [/dev/xle-cam-right, /dev/cam_right]
    frame_id: right_arm_wrist_camera_optical_frame
