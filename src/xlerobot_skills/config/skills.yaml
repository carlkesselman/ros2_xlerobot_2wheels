skill_server:
  ros__parameters:
    # Saved positions and waypoints, the same files the tools and the MCP server use.
    positions_file: ""            # empty = xlerobot_bringup/config/saved_positions.yaml
    waypoints_file: ""            # empty = xlerobot_bringup/config/saved_waypoints.yaml
    head_camera_frame: ""         # empty = the frame_id of the head camera's images
    head_camera_frame_fallback: head_camera_optical_frame   # the model's frame while no camera_info has arrived
    look_at_tolerance_deg: 2.0
    approach_height_m: 0.05       # gap between the object's top and the claw tip
    # The tool point (claw tip) in each arm's gripper_link frame. Printed claws lie along the link's -y axis; their
    # length depends on the print (these are the reference robot's: right 13.2 cm, left about 11 cm). Measure yours,
    # e.g. by resting the tip on the table and finding it in the wrist camera image.
    tip_correction_tolerance_m: 0.005   # re-aim the tool point while it lands farther than this from the goal
    tip_correction_steps: 2
    max_tip_error_m: 0.015        # a tool-point move that ends farther than this (by the encoders) fails NOT_REACHABLE
    # approach keeps the wrist camera above the hand (clear of the table, looking down at the target): wrist roll
    camera_up_wrist_roll_left: 1.5708
    camera_up_wrist_roll_right: 1.5708
    camera_up_tolerance: 0.6
    tip_offset_left: [0.0, -0.111, 0.0]
    tip_offset_right: [0.0, -0.132, 0.0]
    table_margin_m: 0.025         # the table box's top above the measured table: the arms sag 1-2 cm below the model
    table_box_min_x: 0.20         # the table box starts this far in front; the resting claws hang down to table height closer in
    association_gate_m: 0.05      # how far a re-detection may be from the object reference
    nav_timeout_s: 120.0
    arm_timeout_s: 60.0
    default_scaling: 1.0          # arm speed when a goal gives none (MoveIt reads 0 as full speed anyway)
    # touch: straight down in steps until the tool point stops following (two steps in a row) or the load jumps
    touch_step_m: 0.003
    touch_max_travel_m: 0.02      # past the expected contact
    touch_early_margin_m: 0.015   # contact this far above the expected top is something in the way
    touch_stall_ratio: 0.4        # a step that moves less than this share of the command is a stall
    touch_load_jump: 0.2          # effort change between steps on shoulder lift, elbow or wrist flex
    # grasp and place. In the gripper link frame the claw points along -y and the moving jaw closes along +x onto the
    # fixed jaw, whose inner face is at x = grasp_fixed_jaw_x (the CAD's, 2026-11-03; the claw tip is tip_offset).
    grasp_fixed_jaw_x_left: 0.008
    grasp_fixed_jaw_x_right: 0.008
    grasp_open_rad: -0.6          # about 7 cm between the jaws
    grasp_close_rad: 0.35         # commanded closed; on an object the servo stops on it
    grasp_holding_max_rad: 0.15   # after closing, a gripper past this closed on nothing (LOST_OBJECT)
    grasp_side_gap_m: 0.004       # object off the fixed jaw before closing
    grasp_tip_clear_m: 0.008      # claw tips above the object's bottom (the table)
    grasp_max_depth_m: 0.035      # a taller object is gripped this far down from its top
    grasp_pre_height_m: 0.08      # come down onto it along the claw from this far
    grasp_lift_m: 0.08
    grasp_default_size_m: 0.028
    grasp_max_lean_deg: 25.0      # the claw leans outward this far at most, for objects beyond a straight-down reach
    place_inset_m: 0.05           # placing on an object: this far in from the edges of its top
    place_gap_m: 0.004            # placing: the held object's bottom this far above the surface at release
    # Named drop points (the held object's centre at release, base_footprint) for place's `location`.
    # basket: over the top basket (rim 0.78 m, floor 0.68), on the arm's own side, released 6 cm above the rim.
    place_locations: [basket]
    place_basket_left: [-0.13, 0.06, 0.86]
    place_basket_right: [-0.13, -0.06, 0.86]
