# XLeRobot 0.4.0, two-wheel ODrive base, physical dimensions.
#
# These are measurements, not constants. Anything marked TODO is a guess and is
# probably wrong. See ARCHITECTURE.md, calibration section.

xlerobot:
  # Carl's cart (branch rosie): the brushless ODrive base, see docs/rosie-port-plan.md. Base values marked
  # "cart" come from ../XLeRobot (branch rosie-config, config/cart-remote.yaml) and were measured on this cart.
  # Everything still marked TODO, and the head, arms and lidar blocks further down, are the reference robot's
  # numbers until they are measured or calibrated here.
  base:
    # --- odometry critical, do these first ---
    #
    # cart: 6.5 in hub wheel, tyre circumference 51.8 cm (2026-11-01), 0.518 / 2pi = 0.0824. The
    # rolling radius under load; an error here scales every velocity and all odometry, so the
    # straight-line odometry run has the last word.
    wheel_radius: 0.0824

    # Nose-up lean of the whole base, rad, applied as a pitch on base_footprint_joint about the axle
    # so the arms and the head see gravity correctly. cart: essentially level (2026-11-01), the hub
    # wheels and casters took out the reference robot's 0.031.
    pitch_up: 0.0

    # cart: tyre centre to centre between the contact patches, 20 3/4 in (527 mm), measured
    # 2026-10-21. diff_drive_controller calls it wheel_separation.
    wheel_separation: 0.527

    # UMBmark correction if the two wheels are not equal. 1.0 until measured.
    wheel_radius_scale_left: 1.0
    wheel_radius_scale_right: 1.0

    wheel_width: 0.046          # cart: tyre width, measured 2026-11-01
    wheel_mass: 2.5             # TODO weigh, hub motor and tyre

    # --- chassis ---
    # IKEA RASKOG nominal and the reference robot's fit, TODO check against this cart.
    body_length: 0.340
    body_width:  0.405
    body_height: 0.780
    # x of the body box centre in base_link (drive axle is x=0), matched to the
    # centre of raskogbody.stl's footprint (x=-0.048 to 0.344). TODO check
    # against the real cart's front and rear edges.
    body_x_offset: 0.119

    # cart: axle height above floor, about 85 mm (ruler, 2026-11-01). 3 mm over wheel_radius,
    # which comes from the circumference and is the better number; this one only places the
    # model in z.
    axle_height: 0.085

    # axle offset from base_link, positive is forward. TODO
    axle_x_offset: 0.0

    # cart: two passive casters at the rear, in the stock RASKOG mounting place; the drive wheels
    # are at the front and there are no front casters. Larger than stock, chosen to level the cart.
    # No encoder on either, so each is a fixed sphere in the URDF. Positions are the swivel screws:
    # 53 cm behind the axle, about 40 cm apart; wheels 74.5 mm diameter (2026-11-01).
    caster_radius: 0.03725
    # base_link frame, front is +x (the drive-wheel end, where the arms and the
    # head camera face).
    caster_rear_x_offset: -0.53
    caster_y_offset: 0.20

    # cart: 17.2 kg complete (38 lb, new casters), weighed. base_link carries what the URDF has
    # no other link for: chassis, battery, ODESC, Jetson. TODO subtract the arm and head link
    # masses once those are checked; 16 kg until then.
    body_mass: 16.0
    com_height: 0.35            # TODO, this sets the tip over limits

    # --- ODrive (ODESC, ODrive v3 / firmware 0.5.1, USB) ---
    # Read by the ODrive hardware interface (step 2 of the port plan); mock hardware ignores them.
    # The tuning values are cart-measured, from config/base-characterize.sh (2026-10-25); the board's
    # own gains (5.2 / 16.3 at encoder bandwidth 50, current_lim 10.5 A) are saved on the ODESC.
    odrive:
      serial_number: ""         # empty = the first board found
      right_axis: 0             # M0 is the right wheel, M1 the left (board wiring)
      left_axis: 1
      # The left motor is the mirrored one on this cart (invert_left_wheel: true in cart-remote.yaml).
      # That sign is applied once, as diff_drive_controller's left_wheel_radius_multiplier: -1.0
      # (controllers.yaml), never also in the driver.
      max_accel_mps2: 1.0       # per wheel, the board's VEL_RAMP
      friction_ff_nm: 0.36      # feed-forward, 90% of the motors' own drag
      inertia_ff: 0.419         # Nm per turn/s^2, the 17.2 kg cart
      watchdog_s: 0.5           # the board drops the wheels to IDLE after this without a command

  # --- speed limits ---
  # cart: 1.0 m/s and 1.0 m/s^2 per wheel, validated with `step --candidates` on rug and hardwood
  # (2026-10-25); from 1.0 m/s the cart stops in 0.5 s and ~0.5 m. Raise the acceleration only after
  # a brake-from-top-speed test with the arms up. Angular: a pure turn at 1.0 m/s per wheel is
  # 2 * 1.0 / 0.527 = 3.8 rad/s; 2.0 until the turn has been tested with the arms on.
  limits:
    wheel_max_angular_velocity: 12.14  # rad/s, 1.0 m/s / wheel_radius
    linear_velocity_max: 1.0           # m/s
    angular_velocity_max: 2.0          # rad/s
    linear_acceleration_max: 1.0       # m/s^2
    angular_acceleration_max: 2.0      # rad/s^2

  # --- head pan/tilt, IDs 7 and 8 on bus1 ---
  head:
    # pan servo axis in the BODY frame (see base_2wheels.xacro: base_link turned 180
    # degrees about z, front is -x), the frame of the shared upstream URDF. The neck
    # and head parts are the ones in simulation/xlerobot/xlerobot.urdf of the
    # XLeRobot repo (xlerobot_urdf.zip).
    # x: measured, the mast axis is 70 mm behind the front rim of the top basket and
    #    the front rim is 22 mm ahead of the drive axle line, so the axis is 48 mm behind
    #    the axle line (0.048 here, the body frame has the front at -x).
    # z: measured, floor to the top of the pan servo where its axis meets the printed
    #    part, 1.118 m. In the upstream head meshes that junction is 0.073 m above the
    #    pan joint origin, which puts the origin 0.325 m above the top base, upstream
    #    has 0.323, so the neck matches upstream's (see head_pantilt.xacro).
    # camera_x: measured, the lens centre is 65 mm behind the front rim, 5 mm ahead of the
    #    pan axis (tilt frame, see head_pantilt.xacro).
    # camera_z: measured, floor to the head camera lens centre, 1.183 m, upstream's
    #    camera position gives 1.173. It is a plain USB camera, not the depth camera
    #    that URDF's head is made for.
    mount_x: 0.048
    mount_y: 0.0
    mount_z: 1.118
    camera_x: 0.004             # m in the tilt frame, upstream has 0.025
    camera_z: 1.183
    # that URDF's limits, TODO check against the mechanical stops
    pan_limit_lower: -3.2       # rad
    pan_limit_upper:  3.2
    tilt_limit_lower: -0.76
    tilt_limit_upper:  1.45
    # Servo calibration is tools/calibrate_arm.py --arm head, the head looking straight ahead
    # and level is step 2047, and that is the model's zero. direction: +1 if the servo step
    # increases with the joint angle, -1 if it decreases (what the driver reports natively,
    # see the arms below). Checked by moving the head by hand in Rerun.
    # 2148 = step 2047 + 101: with the head looking straight ahead (pan -0.155 rad of the old zero) the servo
    # reads step 2148, so that is the model's zero and the camera points forward at pan 0. The camera
    # was found 8.9 deg left of forward at step 2047 (far wall, depth cloud against the lidar, 3
    # stretches 8.8-9.3 deg). No servo writes, the servo calibration file is unchanged.
    pan_zero_step: 2148
    pan_zero_yaw: 0.0
    pan_direction: -1
    tilt_zero_step: 2047
    tilt_direction: -1
    # rad/s, same value and same reasoning as the arms' max_velocity (see below) - the servos
    # are the same STS3215 family, tracking is now well-characterized (see project history).
    max_velocity: 0.8

  # --- arms, two SO-101 on the cart top, IDs 1-6 (left on bus1, right on bus2) ---
  # The arm meshes, links and joints are those in simulation/xlerobot/xlerobot.urdf
  # of the XLeRobot repo (xlerobot_urdf.zip), zero pose stretched straight. All of
  # this is in the body frame, front is -x, the robot's left is +y there.
  # mount_x: the shoulder pan axes are at the mast's x (0.4.0 CAD,
  #   hardware/step/XLeRobot_040/XLeRobot040_armbase.step).
  # mount_y: pan axis position, 273 mm apart (CAD, confirmed on the robot). That URDF
  #   has them 310 mm apart.
  # mount_z: measured, floor to the bottom of the arm base (its origin), 0.765 m.
  # left_yaw, right_yaw: rotation of each arm base about z, the 0.4.0 arm base can be
  #   mounted in any direction. At the zero pose the stretched arm points to the
  #   front with -1.5708, sideways with 0 or 3.14159, to the back with 1.5708. The
  #   shared URDF has the arms sideways (right 0, left 3.14159), the real robot has
  #   both pointing forward (official assembly video, confirmed by the user).
  arms:
    mount_x: 0.048
    mount_y: 0.1365
    mount_z: 0.765
    right_yaw: -1.57079633
    left_yaw: -1.57079633

    # The SO-101 joints. lower/upper are the limits of the shared upstream URDF, in its joint
    # direction, the same for both arms. The servos are calibrated with
    # tools/calibrate_arm.py (lerobot's procedure), which makes step 2047 the middle of each
    # joint's range, and these say how the model's joints relate to that:
    # zero_step: the servo step where the model's joint angle is 0 (arm stretched straight),
    #   per arm because each arm's middle was set by hand. Read off the arms held stretched
    #   straight (calibrate_arm.py status), except the gripper. The model's gripper is closed at its
    #   lower limit (-0.3745 rad, checked on the jaw meshes, joint angle 0 is open about 30 mm),
    #   so its zero is the closed end stop of the calibration (range_min) + 0.3745 rad = 244 steps.
    # direction: +1 if the servo step increases with the upstream joint angle, -1 if it
    #   decreases. The driver reports (center - step), so -1 is its own direction, and for +1
    #   so101_arm.xacro reverses the joint axis and mirrors the limits, which gives the same
    #   pose. Checked by moving every joint by hand in Rerun.
    # max_velocity: rad/s, the limit planners and trajectories plan with. Was 0.5, deliberately low
    #   while the arms were new; raised to 0.8 (2026-09-27) once real capability was characterized
    #   (see the ACC/streaming fix in sts_hardware_interface - the real bottleneck was a firmware
    #   bug making the servo ignore Speed entirely, not that 0.5 rad/s was near the servo's actual
    #   limit). Stays comfortably under servo_speed_limit_steps below (600 steps/s =~ 0.92 rad/s).
    #   servo_speed_limit_steps: the servos' own cap, in steps/s (4096 per turn), which a large jump
    #   of the command cannot exceed whatever the trajectory says. The cap applies to every
    #   commanded position joint on the bus, the head too.
    servo_speed_limit_steps: 600
    # limit_margin: rad added to both ends of every arm joint's limits, in the model and in
    #   ros2_control. The upstream limits are another arm's stops, and the folded rest pose sits
    #   at a hard stop that reads up to 2 degrees past them here (left elbow). A joint measured
    #   outside its limits makes the trajectory controller shut down. The servos' own
    #   calibrated range limits are the real stops.
    limit_margin: 0.1
    # rest_pose: the folded pose the arms rest in, in the model's joint angles (lift and elbow
    #   near their limits, the gripper closed at its limit), the same for both arms. The
    #   sim's arms start in it and MoveIt has it as the named state `rest`. The real arms rest
    #   a little differently, this one keeps clear of the hard stops.
    #   wrist_roll=1.5708 (90 degrees) keeps the wrist camera/gripper rotated a quarter turn
    #   from the wrist_roll=0 fold - confirmed on real hardware, both arms.
    rest_pose: {shoulder_pan: 0.0, shoulder_lift: 2.6, elbow_flex: -3.0, wrist_flex: 0.0, wrist_roll: 1.5708, gripper: 0.35}
    # folded_pose: the arms as they really lie when parked, folded to the hard stops (measured,
    #   the elbow at its stop). MoveIt must take it as a start state, the self-collision matrix
    #   is generated so that nothing this pose touches counts as a collision.
    folded_pose: {shoulder_pan: 0.15, shoulder_lift: 2.75, elbow_flex: -3.17, wrist_flex: 0.0, wrist_roll: 0.0, gripper: 0.37}
    # Calibration against a fixed ChArUco board (tools/calibrate_arm_camera.py, 20 poses per arm, head camera
    # as the reference). model_offset: rad, added to the reported joint angle in the model so that the
    # model's pose is the real pose (the servo zero steps and every saved position stay as they are).
    # frame_correction: the arms' frame relative to the body (equal-and-opposite to the head-vs-arm
    # difference, the data cannot say which of the two is off). wrist_camera: the optical frame's
    # position and rotation as measured.
    frame_correction: {xyz: "0.023183 -0.006399 -0.008623", rpy: "0.010156 -0.050829 0.004562"}
    # mount_correction: each arm's base relative to the arms' frame, fitted in the table workspace with
    # tools/arm_accuracy.py --fit (the hand's real pose from the wrist camera against the placement sheet). It absorbs
    # what the calibration above, done with the arms in the air, misses near the table: sag at full stretch and wrist
    # errors that the clustered calibration poses could not separate.
    mount_correction:
      left:  {xyz: "0.012111 0.007711 0.002646", rpy: "-0.006927 -0.024701 -0.003282"}
      right: {xyz: "0.067248 0.090929 0.016046", rpy: "0.096916 -0.072291 -0.024834"}
    wrist_camera:
      left:  {xyz: "-0.015770 0.015190 0.003387", rpy: "0.376871 -1.549444 2.303024"}
      right: {xyz: "0.004451 0.026293 0.013168", rpy: "-0.319586 -1.544162 3.034952"}
    joints:
      shoulder_pan:  {zero_step: {left: 2057, right: 2075}, direction:  1, max_velocity: 0.8, lower: -2.16,      upper: 2.16, model_offset: {left: -0.05780, right: -0.03181}}
      shoulder_lift: {zero_step: {left: 3197, right: 3070}, direction: -1, max_velocity: 0.8, lower: -0.22,      upper: 3.37, model_offset: {left: -0.05564, right: 0.04402}}
      elbow_flex:    {zero_step: {left:  989, right: 1056}, direction:  1, max_velocity: 0.8, lower: -0.22,      upper: 3.14, model_offset: {left: -0.01166, right: 0.04683}}
      wrist_flex:    {zero_step: {left: 1978, right: 1991}, direction:  1, max_velocity: 0.8, lower: -1.6580628, upper: 1.6580627, model_offset: {left: 0.06606, right: -0.28337}}
      wrist_roll:    {zero_step: {left: 2079, right: 2018}, direction: -1, max_velocity: 0.8, lower: -2.7438473, upper: 2.8412063, model_offset: {left: -0.00000, right: -0.00000}}
      gripper:       {zero_step: {left: 1802, right: 1766}, direction:  1, max_velocity: 0.8, lower: -0.374533,  upper: 1.7453292}

  # --- LD19 2D lidar, low on the cart frame ---
  # Carl's cart: on the centreline over the drive axle, in the gap between the bottom basket's rim and the
  # middle basket's underside, scan plane about 0.30-0.35 m (docs/rosie-port-plan.md, section 2.4).
  # TODO measure all of these on the cart once it is mounted; until then they are the reference robot's,
  # which hangs its LD19 upside down from the second basket, the same kind of mount.
  # x, y: base_link frame (front is +x), the drive axle is x=0.
  # mount_z: floor to the housing's mounting surface.
  # scan_below_mount: distance between the mounting surface and the scan plane (0.033 m on an LD19),
  #   below the mount when upside down, above it when upright.
  # upside_down: true when it hangs from a shelf, which flips its frame (z down).
  # yaw: rotation of the lidar about z, base_link frame, counter-clockwise seen from above; the LD19's
  #   forward arrow against the robot's front. Checked in RViz against a wall in front of the robot.
  lidar:
    x: 0.0
    y: 0.0
    mount_z: 0.420
    scan_below_mount: 0.033
    upside_down: true
    yaw: 1.5707963
